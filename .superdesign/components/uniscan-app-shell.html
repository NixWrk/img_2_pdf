<div class="min-h-[800px] w-[1280px] overflow-hidden bg-[#202020] font-['Segoe_UI',sans-serif] text-[#f2f2f2]">
  <header class="border-b border-[#353535] bg-[#242424] px-6 pb-4 pt-5">
    <div class="flex items-start justify-between gap-6">
      <div>
        <div class="text-[22px] font-semibold leading-tight">UniScan</div>
        <div class="mt-1 text-[12px] text-[#a0a4ab]">Capture, clean and export documents</div>
      </div>
      <div class="flex items-center gap-5 text-[12px] text-[#a0a4ab]">
        <span>{{ pageCount }} pages</span>
        <span>Camera: {{ cameraState }}</span>
      </div>
    </div>
    <div class="mt-5" data-slot="toolbar"></div>
  </header>

  <nav class="flex h-10 items-center justify-center gap-1 bg-[#242424]" aria-label="Primary">
    <button class="rounded bg-[#1f6aa5] px-3 py-1 text-[12px] text-white">Workspace</button>
    <button class="rounded px-3 py-1 text-[12px] text-[#c8c8c8]">Camera</button>
  </nav>

  <main class="h-[646px] bg-[#202020] p-4" data-slot="content"></main>

  <footer class="flex h-[42px] items-center justify-between border-t border-[#353535] bg-[#242424] px-6 text-[12px] text-[#d4d4d4]">
    <span>{{ statusText }}</span>
    <div data-slot="taskAction"></div>
  </footer>
</div>
