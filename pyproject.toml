[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uniscan"
dynamic = ["version"]
description = "Unified document scanner (camera + files/folder + PDF) toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "UniScan contributors" }
]
dependencies = [
  "opencv-python>=4.8,<5",
  "numpy>=1.26",
  "pillow>=10.0",
  "img2pdf>=0.5",
  "pypdfium2>=4.30,<5.12",
  "customtkinter>=5.2,<6",
  "tkinterdnd2>=0.6.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.7",
]
release = [
  "pyinstaller>=6.21,<7",
  "setuptools>=77",
]
office-lens = [
  "onnxruntime>=1.18",
]

[project.scripts]
uniscan = "uniscan.cli:main"
uniscan-office-lens = "uniscan.office_lens.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = { attr = "uniscan.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"uniscan.office_lens" = ["models/README.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.run]
branch = true
source = ["uniscan"]

[tool.coverage.report]
show_missing = true
skip_covered = true
