name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-artifact:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Create build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[dev,release]"

      - name: Build and smoke-test portable artifact
        shell: pwsh
        run: .\scripts\build_windows.ps1 -SkipInstall

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: uniscan-windows-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Assets = Get-ChildItem artifacts\*.zip, artifacts\*.sha256 | ForEach-Object FullName
          gh release create "${{ github.ref_name }}" @Assets --verify-tag --generate-notes
