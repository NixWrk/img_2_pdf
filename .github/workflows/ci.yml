name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev,release]"

      - name: Check dependencies
        run: python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb

      - name: Test with coverage (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest --cov=uniscan --cov-report=term-missing --cov-fail-under=60 -q

      - name: Test with coverage (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest --cov=uniscan --cov-report=term-missing --cov-fail-under=60 -q

      - name: Enforce non-GUI coverage
        run: python -m coverage report --omit=src/uniscan/ui/app.py --fail-under=80

      - name: Verify dependency license compatibility
        run: python scripts/collect_third_party_licenses.py .license-audit

      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist

      - name: Verify wheel contents and model policy
        run: python scripts/verify_wheel.py dist

      - name: Upload Windows wheel
        if: runner.os == 'Windows' && matrix.python == '3.13'
        uses: actions/upload-artifact@v6
        with:
          name: uniscan-wheel
          path: dist/*.whl
          if-no-files-found: error
